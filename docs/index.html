<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFmpeg Online Builder</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page">
    <section class="hero card">
      <div class="hero-head">
        <p class="eyebrow">GitHub Pages + GitHub Actions</p>
        <label class="lang-switch">
          <span class="visually-hidden" data-i18n="lang.label">Language</span>
          <select id="lang-select" data-i18n-aria-label="lang.label"></select>
        </label>
      </div>
      <h1 data-i18n="page.title">FFmpeg Online Builder</h1>
      <dl class="repo-summary">
        <div>
          <dt data-i18n="hero.repo">Repository</dt>
          <dd id="detected-repo"></dd>
        </div>
        <div>
          <dt data-i18n="hero.issues">Issues</dt>
          <dd id="issues-status"></dd>
        </div>
      </dl>
    </section>

    <section class="card">
      <h2 data-i18n="form.title">Submit a build</h2>
      <form id="build-form" class="build-form">
        <label>
          <span data-i18n="form.source">FFmpeg Git repository</span>
          <input id="source-repository" name="sourceRepository" type="text" inputmode="url" value="https://github.com/FFmpeg/FFmpeg"
            data-i18n-placeholder="form.source.placeholder" required>
          <small data-i18n-html="form.source.help"></small>
        </label>

        <label>
          <span data-i18n="form.ref">Branch / tag / commit (optional)</span>
          <input id="source-ref" name="sourceRef" type="text" data-i18n-placeholder="form.ref.placeholder">
          <small data-i18n="form.ref.help">Commits need the full 40-character SHA; leave empty to build the default branch HEAD.</small>
        </label>

        <div class="grid">
          <label>
            <span data-i18n="form.platform">Target platform</span>
            <select id="target-platform" name="targetPlatform">
              <option value="linux">Linux</option>
              <option value="macos">macOS</option>
              <option value="windows">Windows</option>
              <option value="all" data-i18n="form.platform.all">All platforms (parallel)</option>
            </select>
          </label>

          <label>
            <span data-i18n="form.arch">Target architecture</span>
            <select id="target-arch" name="targetArch">
              <!-- populated dynamically based on selected platform -->
            </select>
          </label>

          <label>
            <span data-i18n="form.package">Package format</span>
            <select id="package-format" name="packageFormat">
              <option value="tar.gz">tar.gz</option>
              <option value="zip">zip</option>
              <option value="nuget">NuGet (.nupkg)</option>
            </select>
          </label>
        </div>
        <!-- Outside the grid so a long note cannot change the height of the fields above. -->
        <small id="package-hint" class="muted"></small>

        <fieldset class="config">
          <legend data-i18n="config.legend">Build options</legend>

          <div id="segments" class="segments"></div>

          <div id="toggle-groups" class="toggle-groups"></div>
          <small id="toggle-notice" class="notice" aria-live="polite"></small>

          <div class="choice-group">
            <div class="group-head">
              <span class="group-title" data-i18n="config.components">Components</span>
              <div id="component-mode" class="segmented" role="radiogroup" data-i18n-aria-label="config.components"></div>
            </div>
            <small id="component-mode-hint" class="muted"></small>
            <div id="component-groups" class="component-groups"></div>
          </div>

          <details class="advanced">
            <summary data-i18n="config.advanced">Advanced: custom flags</summary>
            <label>
              <span data-i18n="config.custom.label">Custom flags (appended last; they override the options above)</span>
              <textarea id="custom-options" rows="3" spellcheck="false" data-i18n-placeholder="config.custom.placeholder"></textarea>
              <small data-i18n-html="config.custom.help"></small>
            </label>
          </details>

          <div class="preview">
            <div class="preview-head">
              <span class="group-title" data-i18n="config.preview">Final configure flags</span>
              <div class="preview-actions">
                <button id="copy-config" type="button" class="secondary small" data-i18n="config.copy">Copy</button>
                <button id="reset-config" type="button" class="secondary small" data-i18n="config.reset">Reset</button>
              </div>
            </div>
            <code id="configure-preview"></code>
            <ul id="config-notes" class="warnings"></ul>
          </div>
        </fieldset>

        <div class="actions">
          <button type="submit" data-i18n="form.submit">Submit on GitHub</button>
        </div>
        <p id="form-message" class="form-message"></p>
      </form>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 data-i18n="builds.title">Builds</h2>
        <button id="refresh-builds" type="button" class="secondary" data-i18n="builds.refresh">Refresh</button>
      </div>
      <p class="lead muted" data-i18n="builds.lead">The latest 20 build issues. Refreshes every 10 minutes while a build is running.</p>
      <div id="build-list" class="run-list empty"></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
