<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFmpeg 在线自动编译</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page">
    <section class="hero card">
      <div class="hero-head">
        <p class="eyebrow">GitHub Pages + GitHub Actions</p>
        <label class="lang-switch">
          <span class="visually-hidden" data-i18n="lang.label">语言</span>
          <select id="lang-select" data-i18n-aria-label="lang.label"></select>
        </label>
      </div>
      <h1 data-i18n="page.title">FFmpeg 在线自动编译</h1>
      <dl class="repo-summary">
        <div>
          <dt data-i18n="hero.repo">当前仓库</dt>
          <dd id="detected-repo"></dd>
        </div>
        <div>
          <dt data-i18n="hero.issues">Issues 功能</dt>
          <dd id="issues-status"></dd>
        </div>
      </dl>
    </section>

    <section class="card">
      <h2 data-i18n="form.title">提交编译任务</h2>
      <form id="build-form" class="build-form">
        <label>
          <span data-i18n="form.source">FFmpeg Git 仓库地址</span>
          <input id="source-repository" name="sourceRepository" type="text" inputmode="url" value="https://github.com/FFmpeg/FFmpeg"
            data-i18n-placeholder="form.source.placeholder" required>
          <small data-i18n-html="form.source.help"></small>
        </label>

        <label>
          <span data-i18n="form.ref">源码分支 / tag / commit（可选）</span>
          <input id="source-ref" name="sourceRef" type="text" data-i18n-placeholder="form.ref.placeholder">
          <small data-i18n="form.ref.help"></small>
        </label>

        <div class="grid">
          <label>
            <span data-i18n="form.platform">目标平台</span>
            <select id="target-platform" name="targetPlatform">
              <option value="linux">Linux</option>
              <option value="macos">macOS</option>
              <option value="windows">Windows</option>
              <option value="all" data-i18n="form.platform.all">全部平台（并行）</option>
            </select>
          </label>

          <label>
            <span data-i18n="form.arch">目标指令集</span>
            <select id="target-arch" name="targetArch">
              <!-- populated dynamically based on selected platform -->
            </select>
          </label>

          <label>
            <span data-i18n="form.package">打包格式</span>
            <select id="package-format" name="packageFormat">
              <option value="tar.gz">tar.gz</option>
              <option value="zip">zip</option>
            </select>
          </label>
        </div>

        <fieldset class="config">
          <legend data-i18n="config.legend">编译参数</legend>

          <div id="segments" class="segments"></div>

          <div id="toggle-groups" class="toggle-groups"></div>
          <small id="toggle-notice" class="notice" aria-live="polite"></small>

          <div class="choice-group">
            <div class="group-head">
              <span class="group-title" data-i18n="config.components">组件</span>
              <div id="component-mode" class="segmented" role="radiogroup" data-i18n-aria-label="config.components"></div>
            </div>
            <small id="component-mode-hint" class="muted"></small>
            <div id="component-groups" class="component-groups"></div>
          </div>

          <details class="advanced">
            <summary data-i18n="config.advanced">高级：自定义参数</summary>
            <label>
              <span data-i18n="config.custom.label">自定义参数（追加在最后，可覆盖上面的选项）</span>
              <textarea id="custom-options" rows="3" spellcheck="false" data-i18n-placeholder="config.custom.placeholder"></textarea>
              <small data-i18n-html="config.custom.help"></small>
            </label>
          </details>

          <div class="preview">
            <div class="preview-head">
              <span class="group-title" data-i18n="config.preview">最终 configure 参数</span>
              <div class="preview-actions">
                <button id="copy-config" type="button" class="secondary small" data-i18n="config.copy">复制</button>
                <button id="reset-config" type="button" class="secondary small" data-i18n="config.reset">恢复默认</button>
              </div>
            </div>
            <code id="configure-preview"></code>
            <ul id="config-notes" class="warnings"></ul>
          </div>
        </fieldset>

        <div class="actions">
          <button type="submit" data-i18n="form.submit">在 GitHub 上提交编译</button>
        </div>
        <p id="form-message" class="form-message"></p>
      </form>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 data-i18n="builds.title">编译记录</h2>
        <button id="refresh-builds" type="button" class="secondary" data-i18n="builds.refresh">刷新</button>
      </div>
      <p class="lead muted" data-i18n="builds.lead">最近 20 个编译 Issue。有任务进行中时每 10 分钟自动刷新一次。</p>
      <div id="build-list" class="run-list empty"></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
