<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFmpeg 在线自动编译</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page">
    <section class="hero card">
      <p class="eyebrow">GitHub Pages + GitHub Actions</p>
      <h1>FFmpeg 在线自动编译</h1>
      <dl class="repo-summary">
        <div>
          <dt>当前仓库</dt>
          <dd id="detected-repo">识别中…</dd>
        </div>
        <div>
          <dt>Issues 功能</dt>
          <dd id="issues-status">检测中…</dd>
        </div>
      </dl>
    </section>

    <section class="card">
      <h2>提交编译任务</h2>
      <form id="build-form" class="build-form">
        <label>
          <span>FFmpeg Git 仓库地址</span>
          <input id="source-repository" name="sourceRepository" type="text" inputmode="url" value="https://github.com/FFmpeg/FFmpeg" placeholder="https://github.com/FFmpeg/FFmpeg 或 git@github.com:your-name/ffmpeg.git" required>
          <small>支持公有/私有 GitHub 仓库（HTTPS 或 SSH 写法）。私有仓库需先在本仓库配置 <code>SOURCE_PAT</code> Secret。</small>
        </label>

        <label>
          <span>源码分支 / tag / commit（可选）</span>
          <input id="source-ref" name="sourceRef" type="text" placeholder="master / n7.1 / 完整 40 位 commit SHA（留空则使用默认分支 HEAD）">
          <small>commit 需填写完整 40 位 SHA；留空则检出源码仓库的默认分支 HEAD。</small>
        </label>

        <div class="grid">
          <label>
            <span>目标平台</span>
            <select id="target-platform" name="targetPlatform">
              <option value="linux">Linux</option>
              <option value="macos">macOS</option>
              <option value="windows">Windows</option>
              <option value="all">全部平台（并行）</option>
            </select>
          </label>

          <label>
            <span>目标指令集</span>
            <select id="target-arch" name="targetArch">
              <!-- populated dynamically based on selected platform -->
            </select>
          </label>

          <label>
            <span>打包格式</span>
            <select id="package-format" name="packageFormat">
              <option value="tar.gz">tar.gz</option>
              <option value="zip">zip</option>
            </select>
          </label>
        </div>

        <fieldset class="config">
          <legend>编译参数</legend>

          <div id="segments" class="segments"></div>

          <div id="toggle-groups" class="toggle-groups"></div>

          <div class="choice-group">
            <div class="group-head">
              <span class="group-title">组件</span>
              <div id="component-mode" class="segmented" role="radiogroup" aria-label="组件"></div>
            </div>
            <small id="component-mode-hint" class="muted"></small>
            <div id="component-groups" class="component-groups"></div>
          </div>

          <details class="advanced">
            <summary>高级：自定义参数 / 从命令行导入</summary>
            <label>
              <span>自定义参数（追加在最后，可覆盖上面的选项）</span>
              <textarea id="custom-options" rows="3" placeholder="例如 --disable-encoders --enable-encoder=aac"></textarea>
              <small>空格或换行分隔，仅允许 <code>[-+./:=,@%A-Za-z0-9_]</code> 字符。</small>
            </label>
            <label>
              <span>从命令行导入</span>
              <textarea id="import-input" rows="3" placeholder="粘贴已有的 configure 参数，例如 ./configure --enable-gpl --enable-shared --disable-doc"></textarea>
            </label>
            <div class="actions">
              <button id="import-apply" type="button" class="secondary small">识别并应用</button>
              <small id="import-result" class="muted"></small>
            </div>
          </details>

          <div class="preview">
            <div class="preview-head">
              <span class="group-title">最终 configure 参数</span>
              <div class="preview-actions">
                <button id="copy-config" type="button" class="secondary small">复制</button>
                <button id="reset-config" type="button" class="secondary small">恢复默认</button>
              </div>
            </div>
            <code id="configure-preview"></code>
            <ul id="config-warnings" class="warnings"></ul>
          </div>
        </fieldset>

        <div class="actions">
          <button type="submit">在 GitHub 上提交编译</button>
        </div>
        <p id="form-message" class="form-message"></p>
      </form>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>编译记录</h2>
        <button id="refresh-builds" type="button" class="secondary">刷新</button>
      </div>
      <p class="lead muted">最近 20 个编译 Issue。有任务进行中时每 10 分钟自动刷新一次。</p>
      <div id="build-list" class="run-list empty">加载中…</div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
