name: FFmpeg 编译
description: 提交一次 FFmpeg 编译任务（只有仓库所有者和协作者提交的 Issue 会被执行）
title: "[build] "
body:
  - type: markdown
    attributes:
      value: |
        推荐通过本仓库的 GitHub Pages 页面填写参数，页面会自动生成这个 Issue。
        提交后 GitHub Actions 会自动开始编译，进度和下载链接会以评论形式回复在本 Issue 中。
  - type: input
    id: source_repository
    attributes:
      label: 源码仓库
      description: GitHub 仓库地址，HTTPS 或 SSH 写法均可。私有仓库需先配置 SOURCE_PAT Secret。
      placeholder: https://github.com/FFmpeg/FFmpeg
    validations:
      required: true
  - type: input
    id: source_ref
    attributes:
      label: 源码分支 / tag / commit
      description: 可留空（使用默认分支 HEAD）；commit 需填写完整 40 位 SHA。
      placeholder: n7.1
  - type: input
    id: package_format
    attributes:
      label: 打包格式
      description: "可选值：tar.gz / zip / nuget / aar / xcframework"
      value: tar.gz
    validations:
      required: true
  - type: input
    id: target_platform
    attributes:
      label: 目标平台
      description: "可选值：linux / macos / windows / android / ios / tvos / visionos / maccatalyst / freebsd / wasm；XCFramework 填 apple"
      value: linux
    validations:
      required: true
  - type: input
    id: target_arch
    attributes:
      label: 目标指令集
      description: "该平台的指令集（如 x86_64 / x86 / arm64 / armv7 / universal）；NuGet / AAR 可用逗号分隔填写多个（如 x86_64,arm64）；XCFramework 填 <平台>_<指令集>（如 ios_arm64,ios_sim_arm64）"
      value: x86_64
    validations:
      required: true
  - type: input
    id: deps_linkage
    attributes:
      label: 第三方库链接方式
      description: "static（链接进 FFmpeg）或 shared（作为单独的共享库随包提供）"
      value: static
  - type: textarea
    id: configure_options
    attributes:
      label: configure 参数
      description: 空格或换行分隔，只允许 [-+./:=,@%A-Za-z0-9_] 字符。
      value: --disable-debug --disable-doc --enable-gpl
    validations:
      required: true
