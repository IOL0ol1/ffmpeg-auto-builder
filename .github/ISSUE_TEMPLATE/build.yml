name: FFmpeg Build
description: Request an FFmpeg build (only issues from the repository owner and collaborators are run)
title: "[build] "
body:
  - type: markdown
    attributes:
      value: |
        Filling in the options on this repository's GitHub Pages site is recommended; the page creates this issue for you.
        After you submit it, GitHub Actions starts the build and replies here with progress and download links.
  - type: input
    id: source_repository
    attributes:
      label: Source repository
      description: GitHub repository URL, HTTPS or SSH form. Private repositories need the SOURCE_PAT secret.
      placeholder: https://github.com/FFmpeg/FFmpeg
    validations:
      required: true
  - type: input
    id: source_ref
    attributes:
      label: Branch / tag / commit
      description: Optional (empty = default branch HEAD); commits need the full 40-character SHA.
      placeholder: n7.1
  - type: input
    id: package_format
    attributes:
      label: Package format
      description: "One of: tar.gz / zip / nuget"
      value: tar.gz
    validations:
      required: true
  - type: input
    id: target_platform
    attributes:
      label: Target platform
      description: "One of: linux / macos / windows / android / ios / tvos / visionos / maccatalyst / freebsd / wasm"
      value: linux
    validations:
      required: true
  - type: input
    id: target_arch
    attributes:
      label: Target architecture
      description: "An architecture of the platform (e.g. x86_64 / x86 / arm64 / armv7 / universal); for NuGet several, comma-separated (e.g. x86_64,arm64)"
      value: x86_64
    validations:
      required: true
  - type: textarea
    id: configure_options
    attributes:
      label: configure flags
      description: Separated by spaces or new lines; only [-+./:=,@%A-Za-z0-9_] characters are allowed.
      value: --disable-debug --disable-doc --enable-gpl
    validations:
      required: true
