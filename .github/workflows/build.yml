name: build-ffmpeg

on:
  # Main entry: an issue created from .github/ISSUE_TEMPLATE/build.yml (the Pages site pre-fills it).
  issues:
    types: [opened]
  # Fallback: Actions → build-ffmpeg → Run workflow.
  workflow_dispatch:
    inputs:
      source_repository:
        description: FFmpeg source repository URL (GitHub HTTPS or SSH form)
        required: true
        type: string
      source_ref:
        description: Branch / tag / full commit SHA (leave empty for default branch HEAD)
        required: false
        type: string
        default: ''
      package_format:
        description: Output package format
        required: true
        type: choice
        options:
          - tar.gz
          - zip
          - nuget
      target_platform:
        description: Target platform
        required: true
        type: choice
        options:
          - linux
          - macos
          - windows
          - android
      target_arch:
        description: Target architecture (see docs/targets.json); for NuGet a comma-separated list, e.g. x86_64,arm64
        required: true
        type: string
        default: x86_64
      configure_options:
        description: FFmpeg configure options
        required: true
        type: string

run-name: >-
  ${{ github.event_name == 'issues'
      && format('#{0} {1}', github.event.issue.number, github.event.issue.title)
      || format('{0} | {1}/{2}', github.actor, inputs.target_platform, inputs.target_arch) }}

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  setup:
    # Issues are public: only build requests from people with write access are executed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, '[build]') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    outputs:
      source_repository: ${{ steps.params.outputs.source_repository }}
      source_slug: ${{ steps.params.outputs.source_slug }}
      source_ref: ${{ steps.params.outputs.source_ref }}
      target_platform: ${{ steps.params.outputs.target_platform }}
      target_arch: ${{ steps.params.outputs.target_arch }}
      package_format: ${{ steps.params.outputs.package_format }}
      archive_format: ${{ steps.params.outputs.archive_format }}
      configure_options: ${{ steps.params.outputs.configure_options }}
      release_tag: ${{ steps.params.outputs.release_tag }}
      matrix: ${{ steps.params.outputs.matrix }}
      merges: ${{ steps.params.outputs.merges }}
      needs_merge: ${{ steps.params.outputs.needs_merge }}
      lang: ${{ steps.lang.outputs.lang }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Replies on the issue use the language of the issue form the page prefilled.
      - name: Detect issue language
        id: lang
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: echo "lang=$(python3 -I scripts/parse-issue.py --lang)" >> "$GITHUB_OUTPUT"

      - name: Resolve build parameters
        id: params
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LANG: ${{ steps.lang.outputs.lang }}
          INPUT_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_TARGET_PLATFORM: ${{ inputs.target_platform }}
          INPUT_TARGET_ARCH: ${{ inputs.target_arch }}
          INPUT_PACKAGE_FORMAT: ${{ inputs.package_format }}
          INPUT_CONFIGURE_OPTIONS: ${{ inputs.configure_options }}
        run: |
          if ! ./scripts/resolve-params.sh 2>"$RUNNER_TEMP/resolve-error.log"; then
            cat "$RUNNER_TEMP/resolve-error.log" >&2
            exit 1
          fi

      - name: Report invalid request
        if: failure() && github.event_name == 'issues'
        shell: bash
        env:
          ISSUE_LANG: ${{ steps.lang.outputs.lang }}
        run: ./scripts/issue-comment.sh invalid "$RUNNER_TEMP/resolve-error.log"

      - name: Acknowledge request
        if: github.event_name == 'issues'
        shell: bash
        env:
          ISSUE_LANG: ${{ steps.lang.outputs.lang }}
          SOURCE_REPOSITORY: ${{ steps.params.outputs.source_repository }}
          SOURCE_REF: ${{ steps.params.outputs.source_ref }}
          TARGET: ${{ steps.params.outputs.target_platform }}/${{ steps.params.outputs.target_arch }}
          PACKAGE_FORMAT: ${{ steps.params.outputs.package_format }}
          CONFIGURE_OPTIONS: ${{ steps.params.outputs.configure_options }}
          RELEASE_TAG: ${{ steps.params.outputs.release_tag }}
        run: ./scripts/issue-comment.sh started

  build:
    name: build ${{ matrix.platform }}/${{ matrix.arch }}
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Runner and container of each target come from docs/targets.json.
    container: ${{ matrix.container }}
    timeout-minutes: 240
    env:
      SOURCE_REPOSITORY: ${{ needs.setup.outputs.source_repository }}
      SOURCE_REF: ${{ needs.setup.outputs.source_ref }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
      TARGET_TOOLCHAIN: ${{ matrix.toolchain }}
      PACKAGE_FORMAT: ${{ needs.setup.outputs.archive_format }}
      CONFIGURE_OPTIONS: ${{ needs.setup.outputs.configure_options }}
      RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CCACHE_MAXSIZE: 500M
    steps:
      # The Ubuntu image has no git; without it actions/checkout falls back to a tarball.
      - name: Install git
        if: startsWith(matrix.container, 'ubuntu:')
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - name: Disable CRLF conversion
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out FFmpeg source
        id: source
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.setup.outputs.source_slug }}
          ref: ${{ needs.setup.outputs.source_ref }}
          # Falls back to the workflow token, which can read public repositories.
          token: ${{ secrets.SOURCE_PAT || github.token }}
          path: ffmpeg-src
          fetch-depth: 1
          persist-credentials: false

      - name: Install build tools
        shell: bash
        run: ./scripts/install-deps.sh

      # Paths come from $GITHUB_WORKSPACE, which is correct inside the container too.
      - name: Locate build directories
        id: dirs
        shell: bash
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "DEPS_PREFIX=$GITHUB_WORKSPACE/.deps/prefix" >> "$GITHUB_ENV"
          # Toolchain changes of one platform do not invalidate the others' libraries.
          echo "toolchain=${{ hashFiles('scripts/build-deps.sh', 'scripts/toolchain.sh', 'scripts/install-deps.sh', format('scripts/platforms/{0}.sh', matrix.toolchain)) }}" >> "$GITHUB_OUTPUT"

      # Same cache entries as the build-deps workflow, which can warm them ahead of time.
      - name: Restore third-party libraries
        uses: actions/cache/restore@v4
        with:
          path: .deps/prefix
          key: deps-v3-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.dirs.outputs.toolchain }}-${{ github.run_id }}
          restore-keys: deps-v3-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.dirs.outputs.toolchain }}-

      - name: Build third-party libraries
        id: deps
        shell: bash
        run: ./scripts/build-deps.sh

      - name: Save third-party libraries
        if: always() && steps.deps.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps/prefix
          key: deps-v3-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.dirs.outputs.toolchain }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-v2-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-v2-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Build and package FFmpeg
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: ./scripts/build-ffmpeg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # Slices of a merged arch get a separate prefix so the release job does not publish them.
          name: ${{ matrix.slice == 'true' && 'slice' || 'ffmpeg' }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ needs.setup.outputs.release_tag }}
          path: dist/packages/*
          if-no-files-found: error

  merge:
    name: merge ${{ matrix.platform }}/${{ matrix.arch }}
    needs: [setup, build]
    if: needs.setup.outputs.needs_merge == 'true'
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.merges) }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
      TARGET_TOOLCHAIN: ${{ matrix.toolchain }}
      SLICES: ${{ matrix.slices }}
      PACKAGE_FORMAT: ${{ needs.setup.outputs.archive_format }}
      RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
      CONFIGURE_OPTIONS: ${{ needs.setup.outputs.configure_options }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download slices
        uses: actions/download-artifact@v4
        with:
          pattern: slice-${{ matrix.platform }}-*-${{ needs.setup.outputs.release_tag }}
          path: slices

      # artifacts/<slice>/ for scripts/merge-slices.sh.
      - name: Arrange slices
        shell: bash
        run: |
          for slice in $SLICES; do
            mkdir -p "artifacts/$slice"
            mv "slices/slice-$TARGET_PLATFORM-$slice-$RELEASE_TAG"/* "artifacts/$slice/"
          done

      - name: Merge with lipo
        shell: bash
        run: ./scripts/merge-slices.sh

      - name: Upload merged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.platform }}-${{ matrix.arch }}-${{ needs.setup.outputs.release_tag }}
          path: dist/packages/*
          if-no-files-found: error

  release:
    needs: [setup, build, merge]
    # Publish whatever succeeded, even if some matrix entries failed.
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
      SOURCE_REPOSITORY: ${{ needs.setup.outputs.source_repository }}
      SOURCE_REF: ${{ needs.setup.outputs.source_ref }}
      TARGET: ${{ needs.setup.outputs.target_platform }}/${{ needs.setup.outputs.target_arch }}
      CONFIGURE_OPTIONS: ${{ needs.setup.outputs.configure_options }}
      ISSUE_LANG: ${{ needs.setup.outputs.lang }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        if: needs.setup.outputs.package_format != 'nuget'
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*-${{ needs.setup.outputs.release_tag }}
          path: release-assets
          merge-multiple: true

      # NuGet: combine the archive of every selected architecture into one .nupkg.
      - name: Download architecture archives for NuGet
        if: needs.setup.outputs.package_format == 'nuget'
        uses: actions/download-artifact@v4
        with:
          pattern: 'ffmpeg-*-${{ needs.setup.outputs.release_tag }}'
          path: nuget-input
          merge-multiple: true

      - name: Set up .NET
        if: needs.setup.outputs.package_format == 'nuget'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack NuGet package
        if: needs.setup.outputs.package_format == 'nuget'
        shell: bash
        env:
          PACKAGE_OWNER: ${{ github.repository_owner }}
          RUN_NUMBER: ${{ github.run_number }}
          TARGET_PLATFORM: ${{ needs.setup.outputs.target_platform }}
        run: python3 -I scripts/pack-nuget.py nuget-input release-assets

      - name: Publish draft release
        id: publish
        shell: bash
        run: |
          shopt -s nullglob
          cd release-assets
          assets=(*)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::No build produced a package; nothing to publish."
            exit 1
          fi

          sha256sum "${assets[@]}" > SHA256SUMS.txt
          {
            echo "Source: $SOURCE_REPOSITORY"
            echo "Ref: ${SOURCE_REF:-<default branch>}"
            echo "Target: $TARGET"
            echo "Configure: \`$CONFIGURE_OPTIONS\`"
            if [[ -n "$ISSUE_NUMBER" ]]; then
              echo "Request: #$ISSUE_NUMBER"
            fi
          } > "$RUNNER_TEMP/notes.md"

          release_url="$(gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt \
            --draft \
            --title "FFmpeg build $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md")"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"

      - name: Report result on issue
        if: always() && github.event_name == 'issues'
        shell: bash
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
        run: ./scripts/issue-comment.sh result
