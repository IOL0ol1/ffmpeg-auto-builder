name: build-ffmpeg

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: FFmpeg source repository URL (GitHub HTTPS or SSH form)
        required: true
        type: string
      source_ref:
        description: Branch / tag / commit to checkout (leave empty for default branch HEAD)
        required: false
        type: string
        default: ''
      target_platform:
        description: Target platform (choose "all" to build all three in parallel)
        required: true
        type: choice
        options:
          - linux
          - macos
          - windows
          - all
      target_arch:
        description: Target instruction set (universal = macOS fat binary; other platforms fall back to x86_64)
        required: true
        type: choice
        options:
          - x86_64
          - x86
          - arm64
          - armv7
          - universal
        default: x86_64
      package_format:
        description: Output package format
        required: true
        type: choice
        options:
          - tar.gz
          - zip
      configure_options:
        description: FFmpeg configure options
        required: true
        type: string
      release_tag:
        description: Draft release tag for this build
        required: true
        type: string

run-name: ${{ github.actor }} | ${{ inputs.target_platform }}/${{ inputs.target_arch }} | ${{ inputs.release_tag }}

permissions:
  actions: read
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      needs_lipo: ${{ steps.set-matrix.outputs.needs_lipo }}
      source_slug: ${{ steps.validate.outputs.source_slug }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate inputs
        id: validate
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          CONFIGURE_OPTIONS: ${{ inputs.configure_options }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          source scripts/common.sh
          validate_release_tag "$RELEASE_TAG"
          sanitize_configure_options "$CONFIGURE_OPTIONS"
          slug="$(parse_repository_slug "$SOURCE_REPOSITORY")"
          echo "source_slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Build matrix
        id: set-matrix
        shell: bash
        env:
          PLATFORM: ${{ inputs.target_platform }}
          ARCH: ${{ inputs.target_arch }}
        run: |
          if [[ "$PLATFORM" == "all" ]]; then
            platforms=(linux macos windows)
          else
            platforms=("$PLATFORM")
          fi

          entries='[]'
          needs_lipo="false"

          # add <platform> <runner> <arch> [cross_prefix] [msystem] [msys2_packages] [universal_slice]
          add() {
            entries="$(jq -c \
              --arg platform "$1" --arg os "$2" --arg arch "$3" \
              --arg cross_prefix "${4:-}" --arg msystem "${5:-}" \
              --arg msys2_packages "${6:-}" --arg universal_slice "${7:-}" \
              '. + [$ARGS.named]' <<<"$entries")"
          }

          mingw64_pkgs="make diffutils zip mingw-w64-x86_64-toolchain mingw-w64-x86_64-pkgconf mingw-w64-x86_64-nasm mingw-w64-x86_64-ccache"
          mingw32_pkgs="make diffutils zip mingw-w64-i686-toolchain mingw-w64-i686-pkgconf mingw-w64-i686-nasm mingw-w64-i686-ccache"
          clangarm64_pkgs="make diffutils zip mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-pkgconf mingw-w64-clang-aarch64-ccache"

          for p in "${platforms[@]}"; do
            case "$p/$ARCH" in
              linux/x86_64 | linux/universal) add linux ubuntu-latest x86_64 ;;
              linux/x86)       add linux ubuntu-latest x86 i686-linux-gnu- ;;
              linux/arm64)     add linux ubuntu-24.04-arm arm64 ;;
              linux/armv7)     add linux ubuntu-latest armv7 arm-linux-gnueabihf- ;;
              macos/x86_64)    add macos macos-15-intel x86_64 ;;
              macos/arm64)     add macos macos-15 arm64 ;;
              macos/universal)
                add macos macos-15-intel x86_64 "" "" "" true
                add macos macos-15 arm64 "" "" "" true
                needs_lipo="true"
                ;;
              windows/x86_64 | windows/universal) add windows windows-latest x86_64 "" MINGW64 "$mingw64_pkgs" ;;
              windows/x86)     add windows windows-latest x86 "" MINGW32 "$mingw32_pkgs" ;;
              windows/arm64)   add windows windows-11-arm arm64 "" CLANGARM64 "$clangarm64_pkgs" ;;
              *) echo "::warning::Skipping unsupported combination $p/$ARCH" ;;
            esac
          done

          if [[ "$(jq length <<<"$entries")" -eq 0 ]]; then
            echo "::error::No buildable target for $PLATFORM/$ARCH"
            exit 1
          fi

          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"
          echo "needs_lipo=$needs_lipo" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_REF: ${{ inputs.source_ref }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
      CROSS_PREFIX: ${{ matrix.cross_prefix }}
      PACKAGE_FORMAT: ${{ inputs.package_format }}
      CONFIGURE_OPTIONS: ${{ inputs.configure_options }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Disable CRLF conversion
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out FFmpeg source
        id: source
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.setup.outputs.source_slug }}
          ref: ${{ inputs.source_ref }}
          # Falls back to the workflow token, which can read public repositories.
          token: ${{ secrets.SOURCE_PAT || github.token }}
          path: ffmpeg-src
          fetch-depth: 1
          persist-credentials: false

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Install dependencies
        if: matrix.platform != 'windows'
        shell: bash
        run: ./scripts/install-deps.sh

      - name: Set up MSYS2
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.msys2_packages }}

      - name: Build and package FFmpeg
        if: matrix.platform != 'windows'
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: ./scripts/build-ffmpeg.sh

      - name: Build and package FFmpeg (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: ./scripts/build-ffmpeg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # Universal slices get a separate prefix so the release job does not publish them.
          name: ${{ matrix.universal_slice == 'true' && 'slice' || 'ffmpeg' }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ inputs.release_tag }}
          path: dist/packages/*
          if-no-files-found: error

  lipo:
    needs: [setup, build]
    if: needs.setup.outputs.needs_lipo == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PACKAGE_FORMAT: ${{ inputs.package_format }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: slice-macos-x86_64-${{ inputs.release_tag }}
          path: artifacts/x86_64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: slice-macos-arm64-${{ inputs.release_tag }}
          path: artifacts/arm64

      - name: Merge into universal binary
        shell: bash
        run: ./scripts/lipo-universal.sh

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-universal-${{ inputs.release_tag }}
          path: dist/packages/*
          if-no-files-found: error

  release:
    needs: [setup, build, lipo]
    # Publish whatever succeeded, even if some matrix entries failed.
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_REF: ${{ inputs.source_ref }}
      TARGET: ${{ inputs.target_platform }}/${{ inputs.target_arch }}
      CONFIGURE_OPTIONS: ${{ inputs.configure_options }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*-${{ inputs.release_tag }}
          path: release-assets
          merge-multiple: true

      - name: Publish draft release
        shell: bash
        run: |
          shopt -s nullglob
          cd release-assets
          assets=(*)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::No build produced a package; nothing to publish."
            exit 1
          fi

          sha256sum "${assets[@]}" > SHA256SUMS.txt
          {
            echo "Source: $SOURCE_REPOSITORY"
            echo "Ref: ${SOURCE_REF:-<default branch>}"
            echo "Target: $TARGET"
            echo "Configure: \`$CONFIGURE_OPTIONS\`"
          } > ../notes.md

          gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt \
            --draft \
            --title "FFmpeg build $RELEASE_TAG" \
            --notes-file ../notes.md
