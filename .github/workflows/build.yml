name: build-ffmpeg

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: FFmpeg source repository URL
        required: true
        type: string
      github_pat:
        description: GitHub PAT used for private source checkout
        required: true
        type: string
      target_platform:
        description: Target platform
        required: true
        type: choice
        options:
          - linux
          - macos
          - windows
      package_format:
        description: Output package format
        required: true
        type: choice
        options:
          - tar.gz
          - zip
      configure_options:
        description: FFmpeg configure options
        required: true
        type: string
      release_tag:
        description: Draft release tag for this build
        required: true
        type: string

run-name: ${{ github.actor }} | ${{ inputs.target_platform }} | ${{ inputs.release_tag }}

permissions:
  actions: read
  contents: write

jobs:
  build-linux:
    if: ${{ inputs.target_platform == 'linux' }}
    runs-on: ubuntu-latest
    env: &build_env
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_PAT: ${{ inputs.github_pat }}
      TARGET_PLATFORM: ${{ inputs.target_platform }}
      PACKAGE_FORMAT: ${{ inputs.package_format }}
      CONFIGURE_OPTIONS: ${{ inputs.configure_options }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps: &build_steps
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mask PAT
        shell: bash
        run: |
          echo "::add-mask::$SOURCE_PAT"

      - name: Validate PAT owner
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          auth_header = " ".join(["Bearer", os.environ["SOURCE_PAT"]])

          request = urllib.request.Request(
              "https://api.github.com/user",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": auth_header,
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          login = payload["login"].lower()
          if owner != login:
              raise SystemExit(
                  f"PAT owner mismatch: workflow owner is {owner}, but the submitted PAT belongs to {login}."
              )
          PY

      - name: Install dependencies
        shell: bash
        run: ./scripts/install-deps.sh

      - name: Build and package FFmpeg
        shell: bash
        run: ./scripts/build-ffmpeg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ inputs.target_platform }}-${{ inputs.release_tag }}
          path: dist/packages/*
          if-no-files-found: error

      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_path="$(find dist/packages -maxdepth 1 -type f | head -n 1)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset_path" --clobber
          else
            gh release create "$RELEASE_TAG" "$asset_path" \
              --draft \
              --title "FFmpeg build $RELEASE_TAG" \
              --notes "Source: $SOURCE_REPOSITORY"$'\n'"Platform: $TARGET_PLATFORM"$'\n'"Configure: $CONFIGURE_OPTIONS"
          fi

  build-macos:
    if: ${{ inputs.target_platform == 'macos' }}
    runs-on: macos-latest
    env: *build_env
    steps: *build_steps

  build-windows:
    if: ${{ inputs.target_platform == 'windows' }}
    runs-on: windows-latest
    env: *build_env
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mask PAT
        shell: bash
        run: |
          echo "::add-mask::$SOURCE_PAT"

      - name: Validate PAT owner
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          auth_header = " ".join(["Bearer", os.environ["SOURCE_PAT"]])

          request = urllib.request.Request(
              "https://api.github.com/user",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": auth_header,
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          login = payload["login"].lower()
          if owner != login:
              raise SystemExit(
                  f"PAT owner mismatch: workflow owner is {owner}, but the submitted PAT belongs to {login}."
              )
          PY

      - name: Install dependencies
        shell: bash
        run: ./scripts/install-deps.sh

      - name: Build and package FFmpeg
        shell: bash
        run: |
          workspace_path="$(cygpath -u "$GITHUB_WORKSPACE")"
          C:/msys64/usr/bin/bash.exe -lc "export MSYSTEM=MINGW64; export CHERE_INVOKING=1; export PATH=/mingw64/bin:/usr/bin:\$PATH; cd '$workspace_path'; ./scripts/build-ffmpeg.sh"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ inputs.target_platform }}-${{ inputs.release_tag }}
          path: dist/packages/*
          if-no-files-found: error

      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_path="$(find dist/packages -maxdepth 1 -type f | head -n 1)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset_path" --clobber
          else
            gh release create "$RELEASE_TAG" "$asset_path" \
              --draft \
              --title "FFmpeg build $RELEASE_TAG" \
              --notes "Source: $SOURCE_REPOSITORY"$'\n'"Platform: $TARGET_PLATFORM"$'\n'"Configure: $CONFIGURE_OPTIONS"
          fi
