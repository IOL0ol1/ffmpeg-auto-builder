name: build-ffmpeg

on:
  # Main entry: an issue created from .github/ISSUE_TEMPLATE/build.yml (the Pages site pre-fills it).
  issues:
    types: [opened]
  # Fallback: Actions → build-ffmpeg → Run workflow.
  workflow_dispatch:
    inputs:
      source_repository:
        description: FFmpeg source repository URL (GitHub HTTPS or SSH form)
        required: true
        type: string
      source_ref:
        description: Branch / tag / full commit SHA (leave empty for default branch HEAD)
        required: false
        type: string
        default: ''
      target_platform:
        description: Target platform (choose "all" to build all three in parallel)
        required: true
        type: choice
        options:
          - linux
          - macos
          - windows
          - all
      target_arch:
        description: Target instruction set (universal = macOS fat binary; other platforms fall back to x86_64)
        required: true
        type: choice
        options:
          - x86_64
          - x86
          - arm64
          - armv7
          - universal
        default: x86_64
      package_format:
        description: Output package format
        required: true
        type: choice
        options:
          - tar.gz
          - zip
      configure_options:
        description: FFmpeg configure options
        required: true
        type: string

run-name: >-
  ${{ github.event_name == 'issues'
      && format('#{0} {1}', github.event.issue.number, github.event.issue.title)
      || format('{0} | {1}/{2}', github.actor, inputs.target_platform, inputs.target_arch) }}

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  setup:
    # Issues are public: only build requests from people with write access are executed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, '[build]') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    outputs:
      source_repository: ${{ steps.params.outputs.source_repository }}
      source_slug: ${{ steps.params.outputs.source_slug }}
      source_ref: ${{ steps.params.outputs.source_ref }}
      target_platform: ${{ steps.params.outputs.target_platform }}
      target_arch: ${{ steps.params.outputs.target_arch }}
      package_format: ${{ steps.params.outputs.package_format }}
      configure_options: ${{ steps.params.outputs.configure_options }}
      release_tag: ${{ steps.params.outputs.release_tag }}
      matrix: ${{ steps.params.outputs.matrix }}
      needs_lipo: ${{ steps.params.outputs.needs_lipo }}
      lang: ${{ steps.lang.outputs.lang }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Replies on the issue use the language of the issue form the page prefilled.
      - name: Detect issue language
        id: lang
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: echo "lang=$(python3 -I scripts/parse-issue.py --lang)" >> "$GITHUB_OUTPUT"

      - name: Resolve build parameters
        id: params
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LANG: ${{ steps.lang.outputs.lang }}
          INPUT_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_TARGET_PLATFORM: ${{ inputs.target_platform }}
          INPUT_TARGET_ARCH: ${{ inputs.target_arch }}
          INPUT_PACKAGE_FORMAT: ${{ inputs.package_format }}
          INPUT_CONFIGURE_OPTIONS: ${{ inputs.configure_options }}
        run: |
          if ! ./scripts/resolve-params.sh 2>"$RUNNER_TEMP/resolve-error.log"; then
            cat "$RUNNER_TEMP/resolve-error.log" >&2
            exit 1
          fi

      - name: Report invalid request
        if: failure() && github.event_name == 'issues'
        shell: bash
        env:
          ISSUE_LANG: ${{ steps.lang.outputs.lang }}
        run: ./scripts/issue-comment.sh invalid "$RUNNER_TEMP/resolve-error.log"

      - name: Acknowledge request
        if: github.event_name == 'issues'
        shell: bash
        env:
          ISSUE_LANG: ${{ steps.lang.outputs.lang }}
          SOURCE_REPOSITORY: ${{ steps.params.outputs.source_repository }}
          SOURCE_REF: ${{ steps.params.outputs.source_ref }}
          TARGET: ${{ steps.params.outputs.target_platform }}/${{ steps.params.outputs.target_arch }}
          PACKAGE_FORMAT: ${{ steps.params.outputs.package_format }}
          CONFIGURE_OPTIONS: ${{ steps.params.outputs.configure_options }}
          RELEASE_TAG: ${{ steps.params.outputs.release_tag }}
        run: ./scripts/issue-comment.sh started

  build:
    name: build ${{ matrix.platform }}/${{ matrix.arch }}
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      SOURCE_REPOSITORY: ${{ needs.setup.outputs.source_repository }}
      SOURCE_REF: ${{ needs.setup.outputs.source_ref }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
      CROSS_PREFIX: ${{ matrix.cross_prefix }}
      PACKAGE_FORMAT: ${{ needs.setup.outputs.package_format }}
      CONFIGURE_OPTIONS: ${{ needs.setup.outputs.configure_options }}
      RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Disable CRLF conversion
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out FFmpeg source
        id: source
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.setup.outputs.source_slug }}
          ref: ${{ needs.setup.outputs.source_ref }}
          # Falls back to the workflow token, which can read public repositories.
          token: ${{ secrets.SOURCE_PAT || github.token }}
          path: ffmpeg-src
          fetch-depth: 1
          persist-credentials: false

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Install dependencies
        if: matrix.platform != 'windows'
        shell: bash
        run: ./scripts/install-deps.sh

      - name: Set up MSYS2
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.msys2_packages }}

      - name: Build and package FFmpeg
        if: matrix.platform != 'windows'
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: ./scripts/build-ffmpeg.sh

      - name: Build and package FFmpeg (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: ./scripts/build-ffmpeg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # Universal slices get a separate prefix so the release job does not publish them.
          name: ${{ matrix.universal_slice == 'true' && 'slice' || 'ffmpeg' }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ needs.setup.outputs.release_tag }}
          path: dist/packages/*
          if-no-files-found: error

  lipo:
    needs: [setup, build]
    if: needs.setup.outputs.needs_lipo == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PACKAGE_FORMAT: ${{ needs.setup.outputs.package_format }}
      RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: slice-macos-x86_64-${{ needs.setup.outputs.release_tag }}
          path: artifacts/x86_64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: slice-macos-arm64-${{ needs.setup.outputs.release_tag }}
          path: artifacts/arm64

      - name: Merge into universal binary
        shell: bash
        run: ./scripts/lipo-universal.sh

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-universal-${{ needs.setup.outputs.release_tag }}
          path: dist/packages/*
          if-no-files-found: error

  release:
    needs: [setup, build, lipo]
    # Publish whatever succeeded, even if some matrix entries failed.
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
      SOURCE_REPOSITORY: ${{ needs.setup.outputs.source_repository }}
      SOURCE_REF: ${{ needs.setup.outputs.source_ref }}
      TARGET: ${{ needs.setup.outputs.target_platform }}/${{ needs.setup.outputs.target_arch }}
      CONFIGURE_OPTIONS: ${{ needs.setup.outputs.configure_options }}
      ISSUE_LANG: ${{ needs.setup.outputs.lang }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*-${{ needs.setup.outputs.release_tag }}
          path: release-assets
          merge-multiple: true

      - name: Publish draft release
        id: publish
        shell: bash
        run: |
          shopt -s nullglob
          cd release-assets
          assets=(*)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::No build produced a package; nothing to publish."
            exit 1
          fi

          sha256sum "${assets[@]}" > SHA256SUMS.txt
          {
            echo "Source: $SOURCE_REPOSITORY"
            echo "Ref: ${SOURCE_REF:-<default branch>}"
            echo "Target: $TARGET"
            echo "Configure: \`$CONFIGURE_OPTIONS\`"
            if [[ -n "$ISSUE_NUMBER" ]]; then
              echo "Request: #$ISSUE_NUMBER"
            fi
          } > "$RUNNER_TEMP/notes.md"

          release_url="$(gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt \
            --draft \
            --title "FFmpeg build $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md")"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"

      - name: Report result on issue
        if: always() && github.event_name == 'issues'
        shell: bash
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
        run: ./scripts/issue-comment.sh result
