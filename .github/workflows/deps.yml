name: build-deps

# Builds the third-party libraries (deps/*.sh) for every supported target and saves them in
# the Actions cache, so FFmpeg builds can reuse them. build-ffmpeg runs the same steps on a
# cache miss; running this workflow ahead of time just warms the cache.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Only this platform (empty = every target in docs/targets.json)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: List targets
        id: targets
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: echo "matrix=$(python3 -I scripts/targets.py all "$PLATFORM")" >> "$GITHUB_OUTPUT"

  deps:
    name: deps ${{ matrix.platform }}/${{ matrix.arch }}
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 180
    env:
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
      TARGET_TOOLCHAIN: ${{ matrix.toolchain }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: ./scripts/install-deps.sh

      - name: Locate dependency prefix
        id: prefix
        shell: bash
        run: |
          echo "DEPS_PREFIX=$GITHUB_WORKSPACE/.deps/prefix" >> "$GITHUB_ENV"
          echo "toolchain=${{ hashFiles('scripts/build-deps.sh', 'scripts/toolchain.sh', 'scripts/install-deps.sh', format('scripts/platforms/{0}.sh', matrix.toolchain)) }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: .deps/prefix
          # Newest prefix built with this toolchain; per-library stamps skip what is current.
          key: deps-v3-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.prefix.outputs.toolchain }}-${{ github.run_id }}
          restore-keys: deps-v3-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.prefix.outputs.toolchain }}-

      - name: Build dependencies
        id: build
        shell: bash
        run: ./scripts/build-deps.sh

      # Saved even when a later library fails, so finished ones are reused next time.
      - name: Save dependencies
        if: always() && steps.build.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps/prefix
          key: deps-v3-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.prefix.outputs.toolchain }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: List libraries
        shell: bash
        run: |
          ls -la .deps/prefix/lib
          ls .deps/prefix/lib/pkgconfig
